name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: invoice-tool-windows
            archive_name: invoice-tool-windows.zip
          - os: macos-latest
            artifact_name: invoice-tool-mac
            archive_name: InvoiceTool-mac.zip
          - os: ubuntu-latest
            artifact_name: invoice-tool-linux
            archive_name: invoice-tool-linux.tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Prepare icons
        run: |
          pip install pillow
          python prepare_icons.py

      - name: Build with PyInstaller
        run: |
          pyinstaller invoice_tool_gui.spec --clean --noconfirm

      # macOS: 对 .app 进行临时签名，解决"已损坏"问题
      - name: Sign macOS app (ad-hoc)
        if: matrix.os == 'macos-latest'
        run: |
          # 移除隔离属性并重新签名
          xattr -cr dist/InvoiceTool.app || true
          codesign --force --deep --sign - dist/InvoiceTool.app
          # 验证签名
          codesign -dv dist/InvoiceTool.app

      - name: Create archive (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cd dist
          Compress-Archive -Path InvoiceTool.exe -DestinationPath ${{ matrix.archive_name }}

      # macOS: 直接压缩 .app bundle
      - name: Create archive (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          cd dist
          zip -r ${{ matrix.archive_name }} InvoiceTool.app

      - name: Create archive (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          cd dist
          tar -czvf ${{ matrix.archive_name }} invoice-tool

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/${{ matrix.archive_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.archive_name }}
