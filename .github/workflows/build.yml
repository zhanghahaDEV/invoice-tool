name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: invoice-tool-windows
            archive_name: invoice-tool-windows.zip
          - os: macos-latest
            artifact_name: invoice-tool-mac
            archive_name: invoice-tool-mac.tar.gz
          - os: ubuntu-latest
            artifact_name: invoice-tool-linux
            archive_name: invoice-tool-linux.tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Prepare icons
        run: |
          pip install pillow
          python prepare_icons.py

      - name: Build with PyInstaller
        run: |
          pyinstaller invoice_tool_gui.spec --clean --noconfirm

      - name: Create archive (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cd dist
          Compress-Archive -Path invoice-tool -DestinationPath ${{ matrix.archive_name }}

      - name: Create archive (Mac/Linux)
        if: matrix.os != 'windows-latest'
        run: |
          cd dist
          tar -czvf ${{ matrix.archive_name }} invoice-tool

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/${{ matrix.archive_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.archive_name }}
