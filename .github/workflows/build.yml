name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: invoice-tool-windows
            archive_name: invoice-tool-windows.zip
          - os: macos-latest
            artifact_name: invoice-tool-mac
            archive_name: invoice-tool-mac.tar.gz
          - os: ubuntu-latest
            artifact_name: invoice-tool-linux
            archive_name: invoice-tool-linux.tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Prepare icons
        run: |
          pip install pillow
          python3 << 'EOF'
          from PIL import Image
          import os

          # Create Windows .ico from icon.jpg
          img = Image.open('gui/icon.jpg')
          icon_sizes = [(16,16), (32,32), (48,48), (64,64), (128,128), (256,256)]
          img.save('gui/icon.ico', sizes=icon_sizes)
          print("Created icon.ico for Windows")

          # Create macOS .icns from icon.jpg
          import struct
          import io

          sizes = [16, 32, 64, 128, 256, 512, 1024]
          icon_types = {16: b'icp4', 32: b'icp5', 64: b'icp6',
                        128: b'ic07', 256: b'ic08', 512: b'ic09', 1024: b'ic10'}

          entries = []
          for size in sizes:
              resized = img.resize((size, size), Image.LANCZOS)
              buf = io.BytesIO()
              resized.save(buf, format='PNG')
              entries.append((icon_types[size], buf.getvalue()))

          header_size = 8
          entries_size = sum(8 + len(data) for _, data in entries)
          total_size = header_size + entries_size

          with open('gui/icon.icns', 'wb') as f:
              f.write(b'icns')
              f.write(struct.pack('>I', total_size))
              for icon_type, data in entries:
                  f.write(icon_type)
                  f.write(struct.pack('>I', 8 + len(data)))
                  f.write(data)
          print("Created icon.icns for macOS")
          EOF

      - name: Build with PyInstaller
        run: |
          pyinstaller invoice_tool_gui.spec --clean --noconfirm

      - name: Create archive (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cd dist
          Compress-Archive -Path invoice-tool -DestinationPath ${{ matrix.archive_name }}

      - name: Create archive (Mac/Linux)
        if: matrix.os != 'windows-latest'
        run: |
          cd dist
          tar -czvf ${{ matrix.archive_name }} invoice-tool

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/${{ matrix.archive_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.archive_name }}
