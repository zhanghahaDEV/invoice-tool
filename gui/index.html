<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invoice Tool</title>
<style>
  @import url('data:text/css,'); /* placeholder - removed external font */

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #FFFFFF;
    --surface: #F8FAFC;
    --border: #E2E8F0;
    --border-hover: #CBD5E1;
    --text: #1E293B;
    --text-secondary: #64748B;
    --text-muted: #94A3B8;
    --blue: #3B82F6;
    --blue-hover: #2563EB;
    --green: #22C55E;
    --green-bg: #F0FDF4;
    --green-border: #BBF7D0;
    --red: #EF4444;
    --red-bg: #FEF2F2;
    --red-border: #FECACA;
    --radius: 12px;
    --radius-sm: 8px;
    --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
    --transition: 200ms ease;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    user-select: none;
    -webkit-user-select: none;
  }

  /* Header */
  .header {
    padding: 20px 28px 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .header h1 {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: -0.3px;
  }
  .header .version {
    font-size: 11px;
    color: var(--text-muted);
    background: var(--surface);
    padding: 2px 8px;
    border-radius: 99px;
    border: 1px solid var(--border);
  }

  /* Main */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 20px 28px;
    gap: 16px;
    overflow-y: auto;
  }

  /* Drop Zone */
  .dropzone {
    border: 2px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface);
    padding: 40px 20px;
    text-align: center;
    cursor: pointer;
    transition: all var(--transition);
  }
  .dropzone:hover {
    border-color: var(--blue);
    background: #EFF6FF;
  }
  .dropzone.has-files {
    border-color: var(--green);
    background: var(--green-bg);
  }
  .dropzone.error {
    border-color: var(--red);
    background: var(--red-bg);
  }
  .dropzone .icon {
    width: 48px;
    height: 48px;
    margin: 0 auto 12px;
    color: var(--text-muted);
    transition: color var(--transition);
  }
  .dropzone:hover .icon { color: var(--blue); }
  .dropzone.has-files .icon { color: var(--green); }
  .dropzone .title {
    font-size: 14px;
    font-weight: 500;
    color: var(--text-secondary);
    margin-bottom: 4px;
  }
  .dropzone .subtitle {
    font-size: 12px;
    color: var(--text-muted);
  }
  .dropzone .file-count {
    display: none;
    margin-top: 8px;
    font-size: 13px;
    font-weight: 500;
    color: var(--green);
  }
  .dropzone.has-files .file-count { display: block; }
  .dropzone .error-msg {
    display: none;
    margin-top: 8px;
    font-size: 13px;
    color: var(--red);
  }
  .dropzone.error .error-msg { display: block; }
  .dropzone.error .title { color: var(--red); }

  /* Path Display */
  .paths {
    display: flex;
    gap: 12px;
  }
  .path-card {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 10px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    min-height: 42px;
  }
  .path-card .path-icon {
    width: 18px;
    height: 18px;
    color: var(--text-muted);
    flex-shrink: 0;
  }
  .path-card .path-label {
    font-size: 11px;
    color: var(--text-muted);
    margin-bottom: 1px;
  }
  .path-card .path-value {
    font-size: 12px;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .path-card .path-value.placeholder {
    color: var(--text-muted);
    font-style: italic;
  }

  /* Preview Table */
  .preview {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    overflow: hidden;
    display: none;
  }
  .preview.show { display: block; }
  .preview-header {
    padding: 10px 14px;
    font-size: 12px;
    font-weight: 500;
    color: var(--text-secondary);
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .preview-table {
    width: 100%;
    font-size: 12px;
  }
  .preview-table th {
    text-align: left;
    padding: 8px 14px;
    color: var(--text-muted);
    font-weight: 500;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    background: var(--bg);
  }
  .preview-table td {
    padding: 6px 14px;
    border-top: 1px solid var(--border);
    color: var(--text);
  }
  .preview-table .ref {
    font-family: 'SF Mono', 'Menlo', monospace;
    font-size: 11px;
    background: #EFF6FF;
    padding: 2px 6px;
    border-radius: 4px;
    color: var(--blue);
  }
  .preview-table .ref.invalid {
    background: var(--red-bg);
    color: var(--red);
  }
  .preview-table .filename {
    max-width: 200px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* Action Button */
  .actions {
    display: flex;
    justify-content: center;
    padding-top: 4px;
  }
  .btn {
    padding: 10px 32px;
    border-radius: var(--radius-sm);
    font-size: 14px;
    font-weight: 500;
    border: none;
    cursor: pointer;
    transition: all var(--transition);
    font-family: inherit;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .btn-primary {
    background: var(--blue);
    color: white;
    box-shadow: var(--shadow);
  }
  .btn-primary:hover:not(:disabled) {
    background: var(--blue-hover);
    box-shadow: var(--shadow-md);
  }
  .btn-primary:disabled {
    background: var(--border);
    color: var(--text-muted);
    cursor: not-allowed;
  }
  .btn-success {
    background: var(--green);
    color: white;
  }
  .btn-success:hover {
    background: #16A34A;
  }
  .btn .spinner {
    width: 16px;
    height: 16px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: white;
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Progress Bar */
  .progress {
    display: none;
    height: 4px;
    background: var(--border);
    border-radius: 99px;
    overflow: hidden;
  }
  .progress.show { display: block; }
  .progress-bar {
    height: 100%;
    background: var(--blue);
    border-radius: 99px;
    transition: width 0.3s ease;
    width: 0%;
  }
  .progress-bar.done { background: var(--green); }

  /* Status Bar */
  .statusbar {
    padding: 10px 28px;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12px;
    color: var(--text-muted);
  }
  .statusbar .status-left {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .statusbar .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--text-muted);
  }
  .statusbar .dot.success { background: var(--green); }
  .statusbar .dot.error { background: var(--red); }
  .statusbar .dot.processing { background: var(--blue); animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

  /* Result Panel */
  .result {
    display: none;
    background: var(--green-bg);
    border: 1px solid var(--green-border);
    border-radius: var(--radius-sm);
    padding: 14px;
  }
  .result.show { display: block; }
  .result-stats {
    display: flex;
    gap: 20px;
    margin-bottom: 10px;
  }
  .result-stat {
    text-align: center;
  }
  .result-stat .num {
    font-size: 20px;
    font-weight: 600;
    color: var(--text);
  }
  .result-stat .label {
    font-size: 11px;
    color: var(--text-muted);
  }
  .result-actions {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin-top: 10px;
  }
  .btn-sm {
    padding: 6px 16px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 500;
    border: 1px solid var(--border);
    background: white;
    color: var(--text);
    cursor: pointer;
    transition: all var(--transition);
    font-family: inherit;
  }
  .btn-sm:hover { background: var(--surface); border-color: var(--border-hover); }
</style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <h1>Invoice Tool</h1>
    <span class="version">v1.0.0</span>
  </div>

  <!-- Main Content -->
  <div class="main">

    <!-- Drop Zone -->
    <div class="dropzone" id="dropzone" onclick="selectDirectory()">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/>
        <path d="M12 11v6m0 0l-2-2m2 2l2-2"/>
      </svg>
      <div class="title" id="dropTitle">点击选择发票目录</div>
      <div class="subtitle" id="dropSubtitle">选择包含PDF发票的文件夹</div>
      <div class="file-count" id="fileCount"></div>
      <div class="error-msg" id="errorMsg"></div>
    </div>

    <!-- Paths -->
    <div class="paths">
      <div class="path-card">
        <svg class="path-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"/>
        </svg>
        <div>
          <div class="path-label">输入目录</div>
          <div class="path-value placeholder" id="inputPath">未选择</div>
        </div>
      </div>
      <div class="path-card">
        <svg class="path-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 19V5a2 2 0 012-2h4l2 2h4a2 2 0 012 2v1M5 19l2.75-7.5M5 19l-2.75-7.5M18 8v11m0 0l2.75-7.5M18 19l-2.75-7.5"/>
        </svg>
        <div>
          <div class="path-label">输出目录</div>
          <div class="path-value placeholder" id="outputPath">自动创建 output/</div>
        </div>
      </div>
    </div>

    <!-- Preview -->
    <div class="preview" id="preview">
      <div class="preview-header">
        <span>预览（前5个文件）</span>
      </div>
      <table class="preview-table">
        <thead><tr><th>文件名</th><th>提单号</th></tr></thead>
        <tbody id="previewBody"></tbody>
      </table>
    </div>

    <!-- Progress -->
    <div class="progress" id="progress">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <!-- Result -->
    <div class="result" id="result">
      <div class="result-stats">
        <div class="result-stat"><div class="num" id="statTotal">0</div><div class="label">总文件</div></div>
        <div class="result-stat"><div class="num" id="statProcessed">0</div><div class="label">已处理</div></div>
        <div class="result-stat"><div class="num" id="statUnique">0</div><div class="label">唯一提单号</div></div>
        <div class="result-stat"><div class="num" id="statDuplicates">0</div><div class="label">重复</div></div>
      </div>
      <div class="result-actions">
        <button class="btn-sm" onclick="openOutput()">打开输出目录</button>
        <button class="btn-sm" onclick="resetAll()">重新选择</button>
      </div>
    </div>

    <!-- Action Button -->
    <div class="actions">
      <button class="btn btn-primary" id="actionBtn" disabled onclick="handleAction()">
        开始处理
      </button>
    </div>
  </div>

  <!-- Status Bar -->
  <div class="statusbar">
    <div class="status-left">
      <div class="dot" id="statusDot"></div>
      <span id="statusText">等待选择发票目录</span>
    </div>
    <span id="statusRight"></span>
  </div>

<script>
  let state = {
    inputDir: '',
    outputDir: '',
    totalFiles: 0,
    processing: false,
    done: false,
    ready: false
  };

  const $ = id => document.getElementById(id);

  // 等待 pywebview API 就绪（官方要求必须监听此事件）
  window.addEventListener('pywebviewready', function() {
    state.ready = true;
    $('statusText').textContent = '就绪，请选择发票目录';
  });

  // Select directory
  function selectDirectory() {
    if (state.processing) return;
    if (!state.ready) {
      $('statusText').textContent = '正在初始化...';
      return;
    }
    pywebview.api.select_directory().then(function(res) {
      if (res.success) {
        state.inputDir = res.path;
        state.done = false;
        updateUI();
        doPreview();
      }
    }).catch(function(e) {
      console.error('select_directory error:', e);
    });
  }

  // Preview
  function doPreview() {
    var dz = $('dropzone');
    dz.classList.remove('error', 'has-files');
    $('dropTitle').textContent = '正在扫描...';
    $('dropSubtitle').textContent = '';

    pywebview.api.preview(state.inputDir).then(function(res) {
      if (res.success) {
        state.totalFiles = res.total_files;
        dz.classList.add('has-files');
        $('dropTitle').textContent = '已选择发票目录';
        $('dropSubtitle').textContent = '点击可重新选择';
        $('fileCount').textContent = '共 ' + res.total_files + ' 个 PDF 文件';
        $('inputPath').textContent = state.inputDir;
        $('inputPath').classList.remove('placeholder');

        var tbody = $('previewBody');
        tbody.innerHTML = '';
        res.previews.forEach(function(p) {
          var tr = document.createElement('tr');
          tr.innerHTML = '<td class="filename" title="' + p.filename + '">' + p.filename + '</td>' +
            '<td><span class="ref ' + (p.valid ? '' : 'invalid') + '">' + (p.reference || '未识别') + '</span></td>';
          tbody.appendChild(tr);
        });
        $('preview').classList.add('show');
        $('actionBtn').disabled = false;
        setStatus('ready', '已选择 ' + res.total_files + ' 个文件');
      } else {
        dz.classList.add('error');
        $('dropTitle').textContent = '选择失败';
        $('errorMsg').textContent = res.error;
        $('actionBtn').disabled = true;
        setStatus('error', res.error);
      }
    }).catch(function(e) {
      dz.classList.add('error');
      $('dropTitle').textContent = '扫描出错';
      $('errorMsg').textContent = String(e);
      setStatus('error', String(e));
    });
  }

  // Handle action button
  function handleAction() {
    if (state.done) { openOutput(); return; }
    if (state.processing) return;

    state.processing = true;
    $('actionBtn').disabled = true;
    $('actionBtn').innerHTML = '<div class="spinner"></div>处理中...';
    $('progress').classList.add('show');
    $('progressBar').style.width = '30%';
    $('progressBar').classList.remove('done');
    setStatus('processing', '正在处理...');

    pywebview.api.process(state.inputDir).then(function(res) {
      $('progressBar').style.width = '100%';

      if (res.success) {
        $('progressBar').classList.add('done');
        state.done = true;
        state.outputDir = res.output_dir;

        $('outputPath').textContent = res.output_dir;
        $('outputPath').classList.remove('placeholder');

        $('statTotal').textContent = res.total;
        $('statProcessed').textContent = res.processed;
        $('statUnique').textContent = res.unique;
        $('statDuplicates').textContent = res.duplicates;
        $('result').classList.add('show');

        $('actionBtn').disabled = false;
        $('actionBtn').innerHTML = '打开输出目录';
        $('actionBtn').className = 'btn btn-success';

        $('dropzone').classList.add('has-files');
        $('fileCount').textContent = '处理完成: ' + res.total + ' 个文件';

        setStatus('success', '完成: ' + res.total + ' 个文件, ' + res.unique + ' 个唯一提单号');
      } else {
        setStatus('error', res.error);
        $('actionBtn').disabled = false;
        $('actionBtn').innerHTML = '开始处理';
        $('progress').classList.remove('show');
      }
      state.processing = false;
    }).catch(function(e) {
      setStatus('error', '处理出错: ' + e);
      $('actionBtn').disabled = false;
      $('actionBtn').innerHTML = '开始处理';
      $('progress').classList.remove('show');
      state.processing = false;
    });
  }

  // Open output directory
  function openOutput() {
    if (state.outputDir) {
      pywebview.api.open_directory(state.outputDir);
    }
  }

  // Reset
  function resetAll() {
    state = { inputDir: '', outputDir: '', totalFiles: 0, processing: false, done: false, ready: state.ready };
    $('dropzone').className = 'dropzone';
    $('dropTitle').textContent = '点击选择发票目录';
    $('dropSubtitle').textContent = '选择包含PDF发票的文件夹';
    $('fileCount').textContent = '';
    $('errorMsg').textContent = '';
    $('inputPath').textContent = '未选择';
    $('inputPath').classList.add('placeholder');
    $('outputPath').textContent = '自动创建 output/';
    $('outputPath').classList.add('placeholder');
    $('preview').classList.remove('show');
    $('previewBody').innerHTML = '';
    $('progress').classList.remove('show');
    $('progressBar').style.width = '0%';
    $('progressBar').classList.remove('done');
    $('result').classList.remove('show');
    $('actionBtn').disabled = true;
    $('actionBtn').innerHTML = '开始处理';
    $('actionBtn').className = 'btn btn-primary';
    setStatus('idle', '等待选择发票目录');
  }

  // Status
  function setStatus(type, text) {
    var dot = $('statusDot');
    dot.className = 'dot';
    if (type === 'success') dot.classList.add('success');
    else if (type === 'error') dot.classList.add('error');
    else if (type === 'processing') dot.classList.add('processing');
    $('statusText').textContent = text;
  }

  function updateUI() {
    $('result').classList.remove('show');
    $('preview').classList.remove('show');
    $('progress').classList.remove('show');
    $('actionBtn').innerHTML = '开始处理';
    $('actionBtn').className = 'btn btn-primary';
    $('actionBtn').disabled = true;
    $('outputPath').textContent = '自动创建 output/';
    $('outputPath').classList.add('placeholder');
  }
</script>

</body>
</html>
